[project]
name = "orca-ml"
version = "0.1.0"
description = "Detection of orca calls from underwater microphone recordings"
authors = [
  { name = "Patrick Pastore" },
  { name = "Bruno Grande" },
]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12"
dependencies = [
  "loguru>=0.7.2",
  "mkdocs>=1.6.1",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "soundfile>=0.12.1",
  "torch>=2.5.1",
  "torchaudio>=2.2.1",
  "torchvision>=0.20.1",
  "tqdm>=4.67.0",
  "typer>=0.13.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system == 'Windows'" },
  { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "platform_system == 'Windows'" },
  { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "platform_system == 'Windows'" },
  { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orca_ml", "orca_ml.modeling"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "types-requests>=2.31.0",
    "types-tqdm>=4.67.0",
]

[tool.mypy]
ignore_missing_imports = true
